<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>VROOMILLION — 10 animation styles</title>
<style>
@font-face{font-family:P;src:url(press-start-2p.woff2)}
:root{--bg:#0b0618;--ink:#f4f1ff;--dim:#a99fd0;--line:#3b2a78}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif;padding:28px 20px 60px}
h1{font:20px P,monospace;color:#ffd23a;margin:0 0 6px;text-align:center;line-height:1.6}
h1 span{color:#ff4fd8}
.sub{color:var(--dim);text-align:center;margin:0 0 26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:22px;max-width:1360px;margin:0 auto}
.card{background:#170d33;border:3px solid var(--line);border-radius:6px;overflow:hidden}
canvas{display:block;width:100%;aspect-ratio:16/9;background:#000}
canvas.px{image-rendering:pixelated}
.meta{padding:12px 14px 14px}
.meta b{font:11px P,monospace;color:#4fd1ff;display:block;margin-bottom:6px;line-height:1.6}
.meta p{margin:0;color:var(--dim);font-size:14px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
</style></head><body>
<h1>VROOM<span>ILLION</span> · 10 STYLES</h1>
<p class="sub">The same moment in each: driving, then smashing an answer card. Pick a number (or mix two).</p>
<div class="grid" id="grid"></div>
<script>
// ---------- shared ----------
const WORDS=["PLATYPUS","KIRIBATI","MAYOCHUP","OCELOT"];
const R=(s=>()=>(s=(s*16807)%2147483647)/2147483647);
const CAR=[
"......KKKKKKKKKKKK......",
".....KLLLLLLLLLLLLK.....",
"....KRCCCCCCCCCCCCRK....",
"....KRCCWCCCCCCCCCRK....",
"..KKRRRRRRRRRRRRRRRRKK..",
".KRLLRRRRRRRRRRRRRRRRRK.",
"KRYYRRRRRRRRRRRRRRRRYYRK",
"KRYYRRRRKKKKKKKKRRRRYYRK",
"KDDDDDDDKWWWWWWKDDDDDDDK",
"KDDDDDDDKKKKKKKKDDDDDDDK",
"KGGGKKKKKKKKKKKKKKKKGGGK",
"KGGGK..............KGGGK",
".KKK................KKK."];
function sprite(ctx,rows,pal,x,y,s){rows.forEach((r,j)=>[...r].forEach((ch,i)=>{const c=pal[ch];if(c){ctx.fillStyle=c;ctx.fillRect(Math.round(x+i*s),Math.round(y+j*s),s,s)}}))}
// card lifecycle: 0..2.2s approach, 2.2..3.2s shatter, then pause
function cyc(t){const c=t%4,w=WORDS[Math.floor(t/4)%WORDS.length];if(c<2.2)return{ph:"in",k:c/2.2,w};if(c<3.2)return{ph:"boom",k:c-2.2,w};return{ph:"none",k:0,w}}
const SH=Array.from({length:14},(_,i)=>{const r=R(i*97+11);return{a:r()*6.28,v:.5+r(),rot:(r()-.5)*12,sz:.12+r()*.18,dx:(r()-.5),dy:(r()-.5)}});
function curveX(d,t,W){return W/2+Math.sin(t*.45)*(1-d)*(1-d)*W*.16}
function road(ctx,W,H,hor,t,c,step=1){
  for(let y=hor;y<H;y+=step){const d=(y-hor)/(H-hor),z=1/(d+.02),b=Math.floor(z*1.1+t*7)%2,half=W*.04+d*W*.52,cx=curveX(d,t,W);
    ctx.fillStyle=c.grass[b];ctx.fillRect(0,y,W,step);
    ctx.fillStyle=c.rumble[b];ctx.fillRect(cx-half*1.12,y,half*2.24,step);
    ctx.fillStyle=c.road[b];ctx.fillRect(cx-half,y,half*2,step);
    if(b&&c.line){ctx.fillStyle=c.line;ctx.fillRect(cx-Math.max(1,half*.025),y,Math.max(1,half*.05),step)}}}
function cardPos(k,W,H,hor,carY){const e=k*k,d=.04+e*.8;return{x:curveX(d,0,W)*0+curveX(d,performance.now()/1000,W),y:hor+(carY-hor)*e,s:.15+e*1.05}}
function bump(t){const c=cyc(t);return c.ph==="boom"&&c.k<.25?Math.sin(c.k*40)*(1-c.k*4):0}

// ---------- the 10 styles ----------
const STYLES=[
{name:"1 · NES 8-BIT (CURRENT-ISH)",desc:"Chunky pixels, few colours, hard bands. Closest to what the game has now.",W:160,H:90,px:1,draw(ctx,t,W,H){
  const hor=44;["#3c1a7a","#6a2ca0","#b0408c","#ff7a5c"].forEach((c,i)=>{ctx.fillStyle=c;ctx.fillRect(0,i*11,W,11)});
  ctx.fillStyle="#ffd23a";ctx.fillRect(68,24,24,12);ctx.fillStyle="#2a114f";for(let x=0;x<W;x+=8){const h=6+((x*7)%9);ctx.fillRect((x-t*6)%(W+8)+W*((x-t*6)%(W+8)<0),hor-h,8,h)}
  road(ctx,W,H,hor,t,{grass:["#1f7a3a","#2a9a48"],rumble:["#ff3b5c","#f4f1ff"],road:["#45406a","#3a355c"],line:"#ffd23a"});
  const c=cyc(t);pixCard(ctx,t,c,W,H,hor,70,{bg:"#170d33",bd:"#ffd23a",tx:"#ffd23a"},8);
  sprite(ctx,CAR,{K:"#12061f",R:"#ff4fd8",L:"#ff9cec",C:"#4fd1ff",W:"#fff",Y:"#ff3b5c",D:"#a3168e",G:"#2a2340"},68,74+Math.round(Math.sin(t*20)*.6)+Math.round(bump(t)*2),1)}},
{name:"2 · 16-BIT ARCADE",desc:"Twice the resolution, sunset gradients, parallax mountains, roadside posts. Richer, still pixel.",W:320,H:180,px:1,draw(ctx,t,W,H){
  const hor=92,g=ctx.createLinearGradient(0,0,0,hor);g.addColorStop(0,"#1b0b4a");g.addColorStop(.6,"#c2407a");g.addColorStop(1,"#ffb35c");ctx.fillStyle=g;ctx.fillRect(0,0,W,hor);
  ctx.fillStyle="#ffe08a";ctx.beginPath();ctx.arc(160,80,26,0,7);ctx.fill();
  mount(ctx,W,hor,t*4,"#5a2a7a",28,.031);mount(ctx,W,hor,t*10,"#2c1450",16,.07);
  road(ctx,W,H,hor,t,{grass:["#2f8f4e","#277a42"],rumble:["#ff3b5c","#ffffff"],road:["#5a5577","#514c6c"],line:"#fff6c2"});
  for(let i=0;i<6;i++){const d=((i/6+t*.9)%1),e=d*d,y=hor+(H-hor)*e,half=W*.04+e*W*.52,cx=curveX(e,t,W),s=1+e*7;ctx.fillStyle="#12061f";ctx.fillRect(cx-half*1.3-s,y-s*5,s*1.4,s*5);ctx.fillRect(cx+half*1.3,y-s*5,s*1.4,s*5);ctx.fillStyle="#ffd23a";ctx.fillRect(cx-half*1.3-s,y-s*5,s*1.4,s)}
  const c=cyc(t);pixCard(ctx,t,c,W,H,hor,140,{bg:"#22124a",bd:"#ff4fd8",tx:"#fff"},10);
  sprite(ctx,CAR,{K:"#12061f",R:"#ff4fd8",L:"#ffc2f2",C:"#7fe0ff",W:"#fff",Y:"#ff5050",D:"#b01c98",G:"#262040"},136,142+Math.sin(t*22)*.8+bump(t)*3,2)}},
{name:"3 · SYNTHWAVE WIREFRAME",desc:"Neon lines on black, striped sun, glowing vector car. Very 80s, very clean.",W:640,H:360,px:0,draw(ctx,t,W,H){
  const hor=190;ctx.fillStyle="#05010f";ctx.fillRect(0,0,W,H);
  const sg=ctx.createLinearGradient(0,60,0,190);sg.addColorStop(0,"#ffd23a");sg.addColorStop(1,"#ff2a8a");ctx.fillStyle=sg;ctx.beginPath();ctx.arc(320,190,110,Math.PI,0);ctx.fill();
  ctx.fillStyle="#05010f";for(let i=0;i<7;i++)ctx.fillRect(200,120+i*11+i*i*.8,240,2+i*1.2);
  ctx.save();ctx.strokeStyle="#ff4fd8";ctx.shadowColor="#ff4fd8";ctx.shadowBlur=10;ctx.lineWidth=1.6;
  for(let i=-14;i<=14;i++){ctx.beginPath();ctx.moveTo(320+i*8,hor);ctx.lineTo(320+i*90,H);ctx.stroke()}
  for(let i=0;i<14;i++){const d=((i+(t*2.2)%1)/14),y=hor+(H-hor)*d*d;ctx.globalAlpha=.3+d*.7;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}ctx.restore();
  const c=cyc(t);ctx.save();ctx.shadowBlur=14;
  if(c.ph==="in"){const e=c.k*c.k,y=hor+(300-hor)*e,s=.2+e;ctx.strokeStyle="#4fd1ff";ctx.shadowColor="#4fd1ff";ctx.lineWidth=2;ctx.strokeRect(320-110*s,y-70*s,220*s,70*s);ctx.fillStyle="#fff";ctx.font=`${Math.round(26*s)}px P`;ctx.textAlign="center";ctx.fillText(c.w,320,y-26*s)}
  if(c.ph==="boom"){ctx.strokeStyle="#4fd1ff";ctx.shadowColor="#4fd1ff";ctx.lineWidth=2;SH.forEach(p=>{const r=c.k*420*p.v;const x=320+Math.cos(p.a)*r,y=250+Math.sin(p.a)*r*.6;ctx.globalAlpha=1-c.k;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(p.rot*c.k)*30,y+Math.sin(p.rot*c.k)*30);ctx.stroke()})}
  ctx.restore();
  const cy=300+bump(t)*6;ctx.save();ctx.strokeStyle="#4fd1ff";ctx.shadowColor="#4fd1ff";ctx.shadowBlur=12;ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(250,cy+40);ctx.lineTo(250,cy);ctx.lineTo(275,cy-14);ctx.lineTo(290,cy-40);ctx.lineTo(350,cy-40);ctx.lineTo(365,cy-14);ctx.lineTo(390,cy);ctx.lineTo(390,cy+40);ctx.closePath();ctx.stroke();
  ctx.beginPath();ctx.moveTo(290,cy-14);ctx.lineTo(350,cy-14);ctx.moveTo(296,cy-36);ctx.lineTo(344,cy-36);ctx.stroke();
  ctx.strokeStyle="#ff3b5c";ctx.shadowColor="#ff3b5c";ctx.strokeRect(258,cy+6,26,10);ctx.strokeRect(356,cy+6,26,10);ctx.restore()}},
{name:"4 · HANDHELD 4-SHADE",desc:"Four greens only, like an old pocket console. Super readable, strong nostalgia, very limited.",W:160,H:90,px:1,draw(ctx,t,W,H){
  const P=["#0f380f","#306230","#8bac0f","#9bbc0f"],hor=40;ctx.fillStyle=P[3];ctx.fillRect(0,0,W,hor);
  ctx.fillStyle=P[2];for(let i=0;i<4;i++){const x=((i*50-t*5)%200+200)%200-20;ctx.fillRect(x,10+i%2*6,18,4);ctx.fillRect(x+4,7+i%2*6,10,3)}
  ctx.fillStyle=P[1];for(let x=0;x<W;x+=4){const h=4+Math.abs(Math.sin((x+t*8)*.05))*8;ctx.fillRect(x,hor-h,4,h)}
  road(ctx,W,H,hor,t,{grass:[P[2],P[1]],rumble:[P[0],P[3]],road:[P[1],P[1]],line:P[3]});
  const c=cyc(t);pixCard(ctx,t,c,W,H,hor,70,{bg:P[3],bd:P[0],tx:P[0]},8);
  sprite(ctx,CAR,{K:P[0],R:P[1],L:P[2],C:P[3],W:P[3],Y:P[0],D:P[0],G:P[0]},68,74+Math.round(bump(t)*2),1)}},
{name:"5 · FLAT LOW-POLY",desc:"Smooth vector shapes, pastel triangles, soft shadows. Modern mobile-game look, no pixels.",W:640,H:360,px:0,draw(ctx,t,W,H){
  const hor=170,g=ctx.createLinearGradient(0,0,0,hor);g.addColorStop(0,"#9ad7ff");g.addColorStop(1,"#ffe1f0");ctx.fillStyle=g;ctx.fillRect(0,0,W,hor);
  const tri=(x,w,h,c)=>{ctx.fillStyle=c;ctx.beginPath();ctx.moveTo(x,hor);ctx.lineTo(x+w/2,hor-h);ctx.lineTo(x+w,hor);ctx.fill()};
  for(let i=0;i<8;i++){const x=((i*110-t*12)%880+880)%880-140;tri(x,180,90+(i%3)*30,["#b9a5ff","#a38cf2","#c7b8ff"][i%3]);ctx.fillStyle="rgba(255,255,255,.35)";ctx.beginPath();ctx.moveTo(x+90,hor-90-(i%3)*30);ctx.lineTo(x+180,hor);ctx.lineTo(x+120,hor);ctx.fill()}
  road(ctx,W,H,hor,t,{grass:["#8fe0a8","#86d69f"],rumble:["#ffffff","#ff9ec7"],road:["#7d7a9c","#77748f"],line:"#ffffff"});
  const c=cyc(t);
  if(c.ph==="in"){const e=c.k*c.k,y=hor+(290-hor)*e,s=.15+e,x=curveX(.04+e*.8,t,W);ctx.fillStyle="rgba(40,20,80,.25)";rr(ctx,x-100*s+6*s,y-70*s+8*s,200*s,64*s,14*s);ctx.fill();ctx.fillStyle="#fff";rr(ctx,x-100*s,y-70*s,200*s,64*s,14*s);ctx.fill();ctx.fillStyle="#5a3fd1";ctx.font=`700 ${Math.round(30*s)}px system-ui`;ctx.textAlign="center";ctx.fillText(c.w,x,y-28*s)}
  if(c.ph==="boom")SH.forEach((p,i)=>{const r=c.k*380*p.v,x=320+Math.cos(p.a)*r,y=250+Math.sin(p.a)*r*.5+c.k*c.k*200;ctx.save();ctx.translate(x,y);ctx.rotate(p.rot*c.k);ctx.globalAlpha=1-c.k*.8;ctx.fillStyle=i%2?"#fff":"#c7b8ff";ctx.beginPath();ctx.moveTo(0,-20);ctx.lineTo(18,14);ctx.lineTo(-16,10);ctx.fill();ctx.restore()});
  const cy=280+bump(t)*8;ctx.fillStyle="rgba(40,20,80,.25)";ctx.beginPath();ctx.ellipse(320,cy+54,95,12,0,0,7);ctx.fill();
  ctx.fillStyle="#ff6fb5";rr(ctx,230,cy-6,180,58,14);ctx.fill();ctx.fillStyle="#ff8fc6";rr(ctx,262,cy-40,116,44,14);ctx.fill();ctx.fillStyle="#9ad7ff";rr(ctx,276,cy-32,88,26,8);ctx.fill();
  ctx.fillStyle="#ff4f6e";rr(ctx,244,cy+8,38,14,6);ctx.fill();rr(ctx,358,cy+8,38,14,6);ctx.fill();ctx.fillStyle="#3d3a5c";rr(ctx,236,cy+44,40,18,6);ctx.fill();rr(ctx,364,cy+44,40,18,6);ctx.fill()}},
{name:"6 · SATURDAY-MORNING CARTOON",desc:"Thick black outlines, squash-and-stretch, comic KRAK! bursts. Loud, bouncy, funny.",W:640,H:360,px:0,draw(ctx,t,W,H){
  const hor=175;ctx.fillStyle="#46b8ff";ctx.fillRect(0,0,W,hor);ctx.lineWidth=5;ctx.strokeStyle="#111";ctx.lineJoin="round";
  for(let i=0;i<3;i++){const x=((i*260-t*20)%780+780)%780-120;ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(x,60+i*15,26,0,7);ctx.arc(x+34,48+i*15,32,0,7);ctx.arc(x+70,62+i*15,24,0,7);ctx.fill();ctx.stroke();ctx.fillStyle="#fff";ctx.fillRect(x-10,62+i*15,90,20)}
  ctx.fillStyle="#5fd35f";ctx.beginPath();ctx.moveTo(0,hor);for(let x=0;x<=W;x+=20)ctx.lineTo(x,hor-30-Math.sin((x+t*30)*.012)*22);ctx.lineTo(W,hor);ctx.fill();ctx.stroke();
  road(ctx,W,H,hor,t,{grass:["#44c244","#3aae3a"],rumble:["#ff3333","#ffffff"],road:["#666","#5c5c5c"],line:"#ffee33"});
  ctx.strokeStyle="#111";ctx.lineWidth=5;
  const c=cyc(t);
  if(c.ph==="in"){const e=c.k*c.k,y=hor+(290-hor)*e,s=.15+e,x=curveX(.04+e*.8,t,W),wob=Math.sin(t*18)*.06;ctx.save();ctx.translate(x,y-40*s);ctx.rotate(wob);ctx.fillStyle="#ffee33";rr(ctx,-105*s,-36*s,210*s,72*s,12*s);ctx.fill();ctx.lineWidth=5*s+1;ctx.stroke();ctx.fillStyle="#111";ctx.font=`900 ${Math.round(34*s)}px Impact,system-ui`;ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(c.w,0,2*s);ctx.restore()}
  if(c.ph==="boom"){const s=1+c.k*.6;ctx.save();ctx.translate(320,190);ctx.scale(s,s);ctx.globalAlpha=1-Math.max(0,c.k-.6)*2.5;ctx.fillStyle="#ff3333";ctx.beginPath();for(let i=0;i<24;i++){const r=i%2?60:120;ctx.lineTo(Math.cos(i/24*6.28)*r,Math.sin(i/24*6.28)*r*.7)}ctx.closePath();ctx.fill();ctx.lineWidth=5;ctx.stroke();ctx.fillStyle="#ffee33";ctx.font="900 54px Impact,system-ui";ctx.textAlign="center";ctx.textBaseline="middle";ctx.lineWidth=8;ctx.strokeText("KRAK!",0,0);ctx.fillText("KRAK!",0,0);ctx.restore()}
  const b=Math.abs(Math.sin(t*9)),sq=1-b*.06+bump(t)*.2,cy=290;ctx.save();ctx.translate(320,cy+40);ctx.scale(1/sq,sq);ctx.lineWidth=5;
  ctx.fillStyle="#ff4fd8";rr(ctx,-95,-50,190,52,18);ctx.fill();ctx.stroke();ctx.fillStyle="#ff4fd8";rr(ctx,-58,-88,116,44,18);ctx.fill();ctx.stroke();ctx.fillStyle="#bdf2ff";rr(ctx,-44,-80,88,26,10);ctx.fill();ctx.stroke();
  ctx.fillStyle="#ff3333";ctx.beginPath();ctx.arc(-62,-26,12,0,7);ctx.fill();ctx.stroke();ctx.beginPath();ctx.arc(62,-26,12,0,7);ctx.fill();ctx.stroke();
  ctx.fillStyle="#222";rr(ctx,-92,0,40,22,8);ctx.fill();ctx.stroke();rr(ctx,52,0,40,22,8);ctx.fill();ctx.stroke();ctx.restore();
  ctx.strokeStyle="#fff";ctx.lineWidth=4;for(let i=0;i<5;i++){const y=262+i*16,x=((t*900+i*130)%400);ctx.globalAlpha=.8;ctx.beginPath();ctx.moveTo(150-x*.2,y);ctx.lineTo(200-x*.2,y);ctx.moveTo(440+x*.2,y);ctx.lineTo(490+x*.2,y);ctx.stroke()}ctx.globalAlpha=1}},
{name:"7 · TOP-DOWN",desc:"Bird's-eye view, the road scrolls down the screen, cards lie on the road ahead. A different game feel.",W:320,H:180,px:1,draw(ctx,t,W,H){
  ctx.fillStyle="#2f8f4e";ctx.fillRect(0,0,W,H);const off=(t*120)%40;
  for(let i=-1;i<6;i++){const y=i*40+off;ctx.fillStyle="#1f6a38";ctx.beginPath();ctx.arc(70,y,12,0,7);ctx.arc(252,y+20,12,0,7);ctx.fill();ctx.fillStyle="#3aa860";ctx.beginPath();ctx.arc(67,y-3,7,0,7);ctx.arc(249,y+17,7,0,7);ctx.fill()}
  ctx.fillStyle="#fff";ctx.fillRect(98,0,4,H);ctx.fillRect(218,0,4,H);ctx.fillStyle="#4a4566";ctx.fillRect(102,0,116,H);
  for(let i=-1;i<7;i++){ctx.fillStyle=i%2?"#ff3b5c":"#fff";ctx.fillRect(94,i*20+(t*120)%40-20+20*((i+1)%2)*0,4,20);ctx.fillRect(222,i*20+(t*120)%40,4,20)}
  ctx.fillStyle="#ffd23a";for(let i=-1;i<6;i++)ctx.fillRect(158,i*36+(t*120)%36,4,18);
  const c=cyc(t);if(c.ph==="in"){const y=-30+c.k*150;ctx.fillStyle="#12061f";ctx.fillRect(116,y-1,88,26);ctx.fillStyle="#fff6c2";ctx.fillRect(118,y+1,84,22);ctx.fillStyle="#12061f";ctx.font="8px P";ctx.textAlign="center";ctx.fillText(c.w,160,y+16)}
  if(c.ph==="boom")SH.forEach(p=>{const r=c.k*140*p.v;ctx.fillStyle=p.v>1?"#fff6c2":"#12061f";ctx.globalAlpha=1-c.k;ctx.fillRect(160+Math.cos(p.a)*r,126+Math.sin(p.a)*r-c.k*60,5,3)});ctx.globalAlpha=1;
  const x=146+Math.sin(t*1.3)*6;ctx.fillStyle="rgba(0,0,0,.3)";ctx.fillRect(x+3,136,28,40);
  ["#12061f","#ff4fd8"].forEach((col,j)=>{ctx.fillStyle=col;ctx.fillRect(x+j,132+j,28-2*j,42-2*j)});ctx.fillStyle="#4fd1ff";ctx.fillRect(x+5,142,18,8);ctx.fillRect(x+6,162,16,5);ctx.fillStyle="#fff6c2";ctx.fillRect(x+3,133,5,3);ctx.fillRect(x+20,133,5,3);ctx.fillStyle="#12061f";ctx.fillRect(x-3,138,3,9);ctx.fillRect(x+28,138,3,9);ctx.fillRect(x-3,160,3,9);ctx.fillRect(x+28,160,3,9)}},
{name:"8 · PAPER CUT-OUT SIDE VIEW",desc:"Side-on camera, layered paper hills with soft shadows, a card on a stick to crash through. Crafty and warm.",W:640,H:360,px:0,draw(ctx,t,W,H){
  ctx.fillStyle="#ffe9c9";ctx.fillRect(0,0,W,H);ctx.fillStyle="#ffcf7a";ctx.beginPath();ctx.arc(500,80,40,0,7);ctx.fill();
  const layer=(sp,base,amp,col,f)=>{ctx.save();ctx.shadowColor="rgba(80,40,20,.35)";ctx.shadowBlur=10;ctx.shadowOffsetY=-4;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,H);for(let x=0;x<=W;x+=10)ctx.lineTo(x,base-Math.sin((x+t*sp)*f)*amp-Math.sin((x+t*sp)*f*2.3)*amp*.4);ctx.lineTo(W,H);ctx.fill();ctx.restore()};
  layer(15,190,30,"#f4a3a3",.008);layer(40,230,22,"#d77fa1",.012);layer(90,265,14,"#9c6bb3",.018);
  ctx.save();ctx.shadowColor="rgba(80,40,20,.35)";ctx.shadowBlur=8;ctx.fillStyle="#5b4a6e";ctx.fillRect(0,290,W,70);ctx.restore();ctx.fillStyle="#fff2d6";for(let i=0;i<8;i++)ctx.fillRect(((i*100-t*260)%800+800)%800-100,320,50,6);
  const c=cyc(t);
  if(c.ph==="in"){const x=660-c.k*440;ctx.fillStyle="#8a5a3a";ctx.fillRect(x-3,230,6,62);ctx.save();ctx.shadowColor="rgba(80,40,20,.4)";ctx.shadowBlur=8;ctx.shadowOffsetX=4;ctx.fillStyle="#fffaf0";ctx.translate(x,200);ctx.rotate(Math.sin(t*3)*.04);ctx.fillRect(-80,-34,160,62);ctx.restore();ctx.fillStyle="#9c3a6a";ctx.font="700 24px Georgia,serif";ctx.textAlign="center";ctx.fillText(c.w,x,206)}
  if(c.ph==="boom")SH.forEach((p,i)=>{const r=c.k*300*p.v;ctx.save();ctx.translate(250+Math.cos(p.a)*r*.8+c.k*120,200+Math.sin(p.a)*r*.5+c.k*c.k*260);ctx.rotate(p.rot*c.k);ctx.shadowColor="rgba(80,40,20,.35)";ctx.shadowBlur=6;ctx.fillStyle="#fffaf0";ctx.fillRect(-14,-10,28,20);ctx.restore()});
